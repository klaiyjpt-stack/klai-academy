<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>클라이 어학원 · Group Talk</title>
<style>
:root{--teal:#1a7f8e;--teal2:#12616d;--gold:#f2b705;--ink:#12333a;--bg:#eef4f5}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Noto Sans KR",Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--teal);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.5px}
header .crumb{font-size:14px;opacity:.9}
button{font:inherit;cursor:pointer}
.back{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 12px}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
/* book grid */
.sec{font-weight:800;margin:18px 4px 10px;color:var(--teal2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border:2px solid #dfe9ea;border-radius:14px;padding:18px;text-align:center;font-weight:800;font-size:17px;transition:.12s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card small{display:block;color:#88a;font-weight:600;font-size:12px;margin-top:4px}
/* lesson list */
.lrow{background:#fff;border:2px solid #dfe9ea;border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.lrow:hover{border-color:var(--gold)}
.lrow .u{background:var(--teal);color:#fff;border-radius:8px;font-size:12px;font-weight:800;padding:4px 8px;white-space:nowrap}
.lrow .t{font-weight:700}
/* talk view */
.talk{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.talk img{width:100%;border-radius:12px;border:2px solid #dfe9ea;background:#fff}
.panel{background:#fff;border-radius:12px;overflow:hidden;border:2px solid #dfe9ea}
.phead{background:var(--teal);color:#fff;padding:12px 16px;font-weight:800;font-size:18px}
.q{display:flex;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid #eef;border-left:6px solid var(--gold)}
.q .n{background:var(--teal);color:#fff;min-width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.q .txt{font-size:18px;line-height:1.35}
.q.on{background:#fff7dd;border-left-color:var(--teal)}
.q.on .txt{font-size:22px;font-weight:700}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.nav button{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:800}
.nav button[disabled]{opacity:.35}
@media(max-width:820px){.talk{grid-template-columns:1fr}}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.vcard{background:#fff;border:2px solid #dfe9ea;border-radius:12px;overflow:hidden}
.vt{background:var(--teal);color:#fff;font-weight:800;padding:10px 14px}
.vframe{position:relative;padding-top:56.25%}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<header>
  <button class="back" id="back" style="display:none">← Back</button>
  <h1>Group Talk</h1><span class="crumb" id="crumb">Klai Language Academy</span>
  <button class="back" id="vidbtn" style="margin-left:auto">🎬 Reference Videos</button>
</header>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script>
const app=document.getElementById('app'), crumb=document.getElementById('crumb'), back=document.getElementById('back');
const VIDEOS=[
 {t:'Group Talk Example ①',id:'1FAYD3c7pcewL00OhqKwCj-Rmnmt1X3L3'},
 {t:'Group Talk Example ②',id:'1NTs0u-85bEw-cxHrz5Ceq2kHBRu2aEOv'},
 {t:'Interview Example',id:'1YPy2Y5K_ofksfxnj-oR2McYzrb7pYr3b'},
 {t:'PPT Video ①',id:'1n8btPNnY4wQgVylt4cuKBBoadhF7IGCL'},
 {t:'PPT Video ②',id:'1QitovVN_aJ8Y2Wf1unGmAKjyjhIm1gwS'},
];
let stack=[{view:'books'}]; // [{view,bi,li}] — books is base so Back shows on every other page
document.getElementById('vidbtn').onclick=()=>go({view:'videos'});
function go(state){stack.push(state);render()}
back.onclick=()=>{ if(stack.length>1){stack.pop();render()} else {location.href='../zoom-keystone.html'} };
function render(){
  const s=stack[stack.length-1]||{view:'books'};
  back.style.display='';
  if(s.view==='books')return books();
  if(s.view==='lessons')return lessons(s.bi);
  if(s.view==='talk')return talk(s.bi,s.li);
  if(s.view==='videos')return videos();
}
function videos(){
  crumb.textContent='Reference Videos';
  app.innerHTML=`<div class="vgrid">`+VIDEOS.map(v=>
    `<div class="vcard"><div class="vt">${v.t}</div>
     <div class="vframe"><iframe src="https://drive.google.com/file/d/${v.id}/preview" allow="autoplay" allowfullscreen></iframe></div></div>`
  ).join('')+`</div>`;
}
function books(){
  crumb.textContent='Choose a book';
  const by={};BOOKS.forEach((b,i)=>{(by[b.series]=by[b.series]||[]).push([b,i])});
  app.innerHTML=Object.entries(by).map(([ser,arr])=>
    `<div class="sec">${ser}</div><div class="grid">`+
    arr.map(([b,i])=>`<button class="card" onclick="go({view:'lessons',bi:${i}})">${b.name}<small>${b.lessons.length} lessons</small></button>`).join('')+
    `</div>`).join('');
}
function lessons(bi){
  const b=BOOKS[bi];crumb.textContent=b.name;
  app.innerHTML=b.lessons.map((l,li)=>
    `<button class="lrow" onclick="go({view:'talk',bi:${bi},li:${li}})">
      <span class="u">${l.unit||''}</span><span class="t">${l.lesson||('Lesson '+(li+1))}</span>
    </button>`).join('');
}
function talk(bi,li){
  const b=BOOKS[bi],l=b.lessons[li];
  crumb.textContent=b.name+' · '+(l.lesson||'');
  app.innerHTML=`<div class="talk">
    ${l.img?`<img src="img/${l.img}" alt="reading">`:'<div></div>'}
    <div class="panel"><div class="phead">${l.lesson||''}</div>
      ${l.qs.map((q,qi)=>`<div class="q" onclick="this.classList.toggle('on')">
        <div class="n">Q${qi+1}</div><div class="txt">${q}</div></div>`).join('')}
    </div></div>
    <div class="nav">
      <button ${li===0?'disabled':''} onclick="stack.pop();go({view:'talk',bi:${bi},li:${li-1}})">← Previous Lesson</button>
      <button ${li===b.lessons.length-1?'disabled':''} onclick="stack.pop();go({view:'talk',bi:${bi},li:${li+1}})">Next Lesson →</button>
    </div>`;
}
render();
</script>
</body>
</html>
