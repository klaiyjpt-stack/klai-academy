<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강사 로그인 · 클라이 어학원</title>
<style>
  :root{--blue:#2b74c4;--blue-d:#215a99;--green:#7cc242;--green-d:#5ea52c;--navy:#1a2740;--ink:#233;--sub:#5b6577;--line:#e6e9f0;--soft:#f4f7fc;--red:#c0392b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;background:var(--soft);color:var(--ink);line-height:1.5;min-height:100vh}
  a{text-decoration:none;color:inherit}
  header{background:linear-gradient(120deg,#2b74c4,#3aa76d);color:#fff}
  .hd{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px}
  .hd .ttl{font-weight:800;font-size:18px}
  .hd .ttl small{display:block;font-weight:500;font-size:12px;opacity:.9;margin-top:2px}
  .hd .out{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer}
  .login{max-width:360px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:0 10px 40px rgba(20,30,60,.1)}
  .login .lg{text-align:center;font-weight:800;font-size:20px;color:var(--navy)}
  .login .ls{text-align:center;color:var(--sub);font-size:13px;margin:4px 0 20px}
  .login label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:12px 0 5px}
  .login input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  .login .btn{width:100%;margin-top:18px;background:var(--blue);color:#fff;border:none;padding:13px;border-radius:11px;font-weight:800;font-size:15px;cursor:pointer}
  .login .err{color:var(--red);font-size:12.5px;margin-top:10px;text-align:center;min-height:16px}
  .wrap{max-width:820px;margin:0 auto;padding:40px 16px}
  .lead{text-align:center;margin-bottom:26px}
  .lead h1{font-size:23px;color:var(--navy);font-weight:800}
  .lead p{color:var(--sub);font-size:14px;margin-top:6px}
  .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:640px){.roles{grid-template-columns:1fr}}
  .role{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 16px;transition:.15s}
  .role:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(26,39,64,.12);border-color:#c7dcc7}
  .role .ic{font-size:36px;width:70px;height:70px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--soft)}
  .role h3{font-size:16px;color:var(--navy);font-weight:800}
  .role p{font-size:12px;color:var(--sub)}
  .hidden{display:none}
</style>
</head>
<body>

<!-- 페이지 선택 -->
<div id="pickView" class="hidden">
  <header><div class="hd"><div class="ttl">클라이 어학원 · 강사<small>내 페이지 선택</small></div><button class="out" id="logoutBtn">로그아웃</button></div></header>
  <div class="wrap">
    <div class="lead"><h1>어느 수업 페이지로?</h1><p><span id="who"></span> 님 · 로그인됨</p></div>
    <div class="roles">
      <a class="role" href="teacher.html"><div class="ic">🌐</div><h3>원어민</h3><p>ZOOM · IB · Keystone · Pathways</p></a>
      <a class="role" href="teacher-class.html?program=알파"><div class="ic">🅰️</div><h3>알파</h3><p>알파영어 반 기록</p></a>
      <a class="role" href="teacher-class.html?program=문법"><div class="ic">📝</div><h3>문법</h3><p>영어도서관 문법</p></a>
      <a class="role" href="teacher-class.html?program=독해"><div class="ic">📖</div><h3>독해</h3><p>독해 반 기록</p></a>
      <a class="role" href="teacher-class.html?program=영어도서관"><div class="ic">📚</div><h3>영어도서관</h3><p>영어도서관 반 기록</p></a>
      <a class="role" id="memoCard" href="#"><div class="ic">📖</div><h3>본문 암기</h3><p>교과서 본문 출제·관리</p></a>
    </div>
  </div>
</div>

<div style="position:fixed;right:16px;bottom:16px;display:flex;gap:8px;z-index:80">
  <button onclick="history.back()" style="background:#fff;border:1px solid #e6e9f0;border-radius:999px;width:46px;height:46px;font-size:18px;cursor:pointer;box-shadow:0 4px 14px rgba(20,30,60,.15)" title="뒤로">←</button>
  <a href="login.html" style="background:#1a2740;color:#fff;border-radius:999px;width:46px;height:46px;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(20,30,60,.2)" title="홈">🏠</a>
</div>

<script>
const SUPABASE_URL  = "https://hxlzccwqxamtsjrrtcdq.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4bHpjY3dxeGFtdHNqcnJ0Y2RxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODA2NzgsImV4cCI6MjEwMTg1NjY3OH0.V19Jbcb7fS1lW6SwsZrn-dCTkUPaNN1KmBbdslDxfr4";
const $=s=>document.querySelector(s);
function show(v){ ['pickView'].forEach(x=>{const el=$('#'+x); if(el) el.classList.toggle('hidden',x!==v);}); }
(async()=>{
  // ponytail: 비번 없이 바로 진입(개발용). 세션 있으면 이름 표시.
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  const SB = createClient(SUPABASE_URL, SUPABASE_ANON);
  const ADMINS=['klai.yj.pt@gmail.com'];   // 원장 계정
  const { data:{ session } } = await SB.auth.getSession();
  if(!session){ location.replace('staff-login.html?next=teacher-hub.html'); return; }
  const asTeacher = new URLSearchParams(location.search).get('as')==='teacher';
  if(ADMINS.includes((session.user.email||'').toLowerCase()) && !asTeacher){ location.replace('admin.html'); return; }  // 원장은 원장 페이지로 (단, ?as=teacher면 강사 화면 열람 허용)

  // 본문 암기 출제 — 포털 로그인 증표를 넘겨 비밀번호 없이 들어간다.
  const memo=$('#memoCard');
  if(memo) memo.addEventListener('click', e=>{
    e.preventDefault();
    const t = session && session.access_token;
    location.href = t ? `https://klai-memo.vercel.app/sso?t=${encodeURIComponent(t)}` : `https://klai-memo.vercel.app/admin`;
  });
  $('#who').textContent = session.user.user_metadata?.name||session.user.email?.split('@')[0]||'강사';
  show('pickView');
  const lo=$('#logoutBtn'); if(lo) lo.onclick=async()=>{ await SB.auth.signOut(); location.reload(); };
})();
</script>
</body>
</html>
