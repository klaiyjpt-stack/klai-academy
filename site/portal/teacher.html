<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선생님 페이지 · 클라이 어학원</title>
<style>
  :root{--blue:#2b74c4;--blue-d:#215a99;--green:#7cc242;--green-d:#5ea52c;--navy:#1a2740;--ink:#233;--sub:#5b6577;--line:#e6e9f0;--soft:#f4f7fc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;background:var(--soft);color:var(--ink);line-height:1.5}
  a{text-decoration:none;color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}
  header{background:linear-gradient(120deg,#2b74c4,#3aa76d);color:#fff}
  .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px}
  .hd .ttl{font-weight:800;font-size:18px}
  .hd .ttl small{display:block;font-weight:500;font-size:12px;opacity:.9;margin-top:2px}
  .hd .me{text-align:right;font-size:13px;opacity:.95}
  .hd .out{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;margin-left:10px}
  .setup{background:#fff8e1;border-bottom:1px solid #f0e0a8;color:#7a5c00;font-size:12.5px;padding:9px 16px;text-align:center}
  .login{max-width:360px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:0 10px 40px rgba(20,30,60,.1)}
  .login .lg{text-align:center;font-weight:800;font-size:20px;color:var(--navy)}
  .login .ls{text-align:center;color:var(--sub);font-size:13px;margin:4px 0 20px}
  .login label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:12px 0 5px}
  .login input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  .login .btn{width:100%;margin-top:18px;background:var(--blue);color:#fff;border:none;padding:13px;border-radius:11px;font-weight:800;font-size:15px;cursor:pointer}
  .login .err{color:#c0392b;font-size:12.5px;margin-top:10px;text-align:center;min-height:16px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0}
  .bar select,.bar input[type=date]{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
  .langseg{display:flex;background:#e9eef6;border-radius:10px;padding:3px}
  .langseg button{border:none;background:none;padding:8px 13px;border-radius:8px;font-weight:800;font-size:13px;color:var(--sub);cursor:pointer}
  .langseg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .seg{margin-left:auto;display:flex;background:#e9eef6;border-radius:10px;padding:3px}
  .seg button{border:none;background:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;color:var(--sub);cursor:pointer}
  .seg button.on{background:var(--blue);color:#fff}
  .eyebrow{color:var(--green-d);font-weight:800;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin:20px 2px 10px}
  .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:720px){.tools{grid-template-columns:1fr}}
  .tool{display:flex;gap:13px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;transition:.15s}
  .tool:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(26,39,64,.1);border-color:#c7dcc7}
  .tool .ic{font-size:26px;width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--soft);flex:none}
  .tool h3{font-size:15px;color:var(--navy);font-weight:800}
  .tool p{font-size:12px;color:var(--sub);margin-top:2px}
  .tool .soon{font-size:10px;font-weight:800;color:#8a6d1a;background:#fef6df;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:middle}
  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
  .phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .phead h2{font-size:16px;color:var(--navy);font-weight:800}
  .phead .pill{font-size:11px;font-weight:800;color:var(--blue-d);background:#eaf2fc;border-radius:999px;padding:3px 9px}
  .desc{color:var(--sub);font-size:12.5px;margin-bottom:14px}
  .evalrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .evalrow select{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
  .mini{border:1px dashed #b9c6da;background:#f2f6fc;color:var(--blue-d);font-weight:700;font-size:13px;padding:9px 12px;border-radius:10px;cursor:pointer}
  .hint{font-size:11.5px;color:#8a6d1a;background:#fef6df;border-radius:999px;padding:5px 11px}
  .tblwrap{overflow-x:auto}
  table.grid{width:100%;border-collapse:collapse;min-width:720px}
  table.grid th,table.grid td{padding:11px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:13.5px}
  table.grid thead th{background:var(--soft);color:var(--sub);font-weight:800;font-size:12px}
  table.grid td.name{text-align:left;font-weight:700;color:var(--navy)}
  table.grid td.name small{display:block;color:var(--sub);font-weight:500;font-size:11.5px}
  table.grid select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
  .chk{width:22px;height:22px;cursor:pointer;accent-color:var(--green)}
  .scorebox{display:inline-flex;align-items:center;gap:4px}
  .scorebox input{width:44px;padding:6px;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:14px}
  .iconbtn{background:none;border:none;font-size:16px;cursor:pointer;opacity:.6}.iconbtn:hover{opacity:1}
  .saverow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .saverow .note{font-size:12.5px;color:var(--sub)}
  .btnsave{display:flex;gap:8px}
  .btn2{padding:11px 18px;border-radius:11px;font-weight:800;font-size:14px;border:none;cursor:pointer}
  .btn2.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
  .btn2.pri{background:var(--blue);color:#fff}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:80}
  .toast.on{opacity:1}
  .hidden{display:none}
</style>
</head>

  </header>

      <select id="classSel"></select>
      <input type="date" id="dateSel">

        <button class="on" data-mode="ind" data-t="segInd"></button>
        <button data-mode="cls" data-t="segCls"></button>
      </div>
    </div>

    <div class="eyebrow" data-t="tools"></div>
    <div class="tools">
      <a class="tool" href="../write/index.html"><div class="ic">✍️</div><div><h3>Writing Lab</h3><p data-t="toolWriting"></p></div></a>
      <a class="tool" href="#" onclick="toast(T().soonReport);return false"><div class="ic">📄</div><div><h3 data-t="toolReport"></h3><p data-t="toolReportSub"></p></div></a>
      <a class="tool" href="#" onclick="toast(T().soonWorkbook);return false"><div class="ic">📚</div><div><h3 data-t="toolWorkbook"></h3><p data-t="toolWorkbookSub"></p></div></a>

    </div>

    <div class="eyebrow" style="margin-top:24px" data-t="records"></div>
    <div class="panel">
      <div class="phead"><h2 data-t="indEntry"></h2><span class="pill" id="clsPill"></span></div>
      <div class="desc" data-t="indDesc"></div>
      <div class="evalrow">
        <span style="font-size:13px;font-weight:700;color:var(--sub)" data-t="test"></span>
        <select id="evalSel"></select>
        <button class="mini" onclick="toast(T().newTestSoon)" data-t="newTest"></button>
        <span class="hint" data-t="testHint"></span>
      </div>
      <div class="tblwrap"><table class="grid">

        </tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>

    <div class="saverow">
      <div class="note" data-t="saveNote"></div>
      <div class="btnsave">
        <button class="btn2 ghost" onclick="save(false)" data-t="saveDraft"></button>
        <button class="btn2 pri" onclick="save(true)" data-t="savePublish"></button>
      </div>
    </div>
    <div style="height:30px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

  $('#upw').placeholder = LANG==='ko'?'비밀번호':'Password';
  $('#evalSel').innerHTML = s.evals.map(e=>`<option>${e}</option>`).join('');
  document.querySelectorAll('.langseg button').forEach(b=>b.classList.toggle('on', b.dataset.lang===LANG));
  if($('#teaName').dataset.demo==='1'){ $('#teaName').textContent=TEACHER; $('#teaClasses').textContent=`${Object.keys(DEMO).length}${LANG==='ko'?'개 반':' classes'}`; }
  renderRows($('#classSel').value || Object.keys(DEMO)[0]);
}
function setLang(l){ LANG=l; localStorage.setItem('klai_tea_lang',l); applyLang(); }
document.querySelectorAll('.langseg button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

function fillClasses(){ $('#classSel').innerHTML = Object.keys(DEMO).map(n=>`<option>${n}</option>`).join(''); }
function renderRows(cls){
  const s=STR[LANG], list=DEMO[cls]||[];
  $('#clsPill').textContent = `${cls} · ${list.length}${LANG==='ko'?'명':' '+s.students}`;
  $('#rows').innerHTML = list.map(st=>`
    <tr>
      <td class="name">${LANG==='ko'?st.ko:st.en} <span style="color:var(--sub);font-weight:500;font-size:12px">${st.code}</span><small>${LANG==='ko'?st.en:st.ko}</small></td>
      <td><select class="att">${s.att.map(a=>`<option>${a}</option>`).join('')}</select></td>
      <td><input type="checkbox" class="chk hw"></td>
      <td><span class="scorebox"><input class="sc" type="number" min="0" placeholder="-"> / <input class="mx" type="number" min="1" value="20"></span></td>
      <td><select class="tae">${s.tae.map(a=>`<option>${a}</option>`).join('')}</select></td>
      <td><button class="iconbtn" onclick="toast(T().cVideo)">🎬＋</button></td>
      <td><button class="iconbtn" onclick="toast(T().cNote)">📝</button></td>
      <td><input type="checkbox" class="chk pub" checked></td>
    </tr>`).join('');
}
function collect(){ return [...document.querySelectorAll('#rows tr')].map(tr=>({
  att:ATTV[tr.querySelector('.att').value], homework:tr.querySelector('.hw').checked,
  score:tr.querySelector('.sc').value||null, max:tr.querySelector('.mx').value||null,
  attitude:tr.querySelector('.tae').selectedIndex, isPublic:tr.querySelector('.pub').checked })); }
function save(publish){
  const data=collect();
  // TODO(Phase2): Supabase upsert attendance/scores (공개=반영)
  console.log('save',{publish,class:$('#classSel').value,eval:$('#evalSel').value,data});
  toast(publish ? STR[LANG].savedPub(data.length) : STR[LANG].savedDraft);
}
window.save = save;
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  if(b.dataset.mode==='cls') toast(LANG==='ko'?'반별 공통 입력은 곧 (데모)':'Class-wide entry — coming soon (demo)');
});

function boot(){ if(NOTION_URL) $('#notionCard').href=NOTION_URL; $('#dateSel').value='2026-08-18';
  $('#teaSel').innerHTML = Object.keys(ROSTER).map(t=>`<option>${t}</option>`).join('');
  $('#teaSel').value = TEACHER;
  $('#teaSel').onchange = ()=>{ TEACHER=$('#teaSel').value; DEMO=ROSTER[TEACHER]; fillClasses(); applyLang(); };
  fillClasses(); $('#classSel').onchange=()=>renderRows($('#classSel').value); applyLang(); }
function show(v){ ['loginView','dashView'].forEach(x=>$('#'+x).classList.toggle('hidden', x!==v)); }

if(!SUPABASE_URL || !SUPABASE_ANON){
  $('#setupBanner').classList.remove('hidden');
  $('#teaName').dataset.demo='1'; boot(); show('dashView');
} else { (async()=>{
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
  async function route(){ const { data:{ session } } = await sb.auth.getSession();
    if(session){ $('#teaName').textContent = session.user.user_metadata?.name || session.user.email?.split('@')[0] || 'Teacher';
      $('#teaClasses').textContent=''; boot(); show('dashView'); } else { applyLang(); show('loginView'); } }
  $('#loginBtn').onclick = async ()=>{ const id=$('#uid').value.trim(),pw=$('#upw').value; $('#loginErr').textContent='';
    if(!id||!pw){ $('#loginErr').textContent=STR[LANG].needInput; return; }
    const email=id.includes('@')?id:id+ID_DOMAIN; const {error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error) $('#loginErr').textContent=STR[LANG].badLogin; else route(); };
  $('#upw').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#loginBtn').click(); });
  $('#logoutBtn').onclick = async ()=>{ await sb.auth.signOut(); route(); };
  applyLang(); route();
})(); }
</script>
</body>
</html>
