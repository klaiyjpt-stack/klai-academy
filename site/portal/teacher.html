<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선생님 페이지 · 클라이 어학원</title>
<style>
  :root{--blue:#2b74c4;--blue-d:#215a99;--green:#7cc242;--green-d:#5ea52c;--navy:#1a2740;--ink:#233;--sub:#5b6577;--line:#e6e9f0;--soft:#f4f7fc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;background:var(--soft);color:var(--ink);line-height:1.5}
  a{text-decoration:none;color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}
  header{background:linear-gradient(120deg,#2b74c4,#3aa76d);color:#fff}
  .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px}
  .hd .ttl{font-weight:800;font-size:18px}
  .hd .ttl small{display:block;font-weight:500;font-size:12px;opacity:.9;margin-top:2px}
  .hd .me{text-align:right;font-size:13px;opacity:.95}
  .hd .out{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;margin-left:10px}
  .setup{background:#fff8e1;border-bottom:1px solid #f0e0a8;color:#7a5c00;font-size:12.5px;padding:9px 16px;text-align:center}
  .login{max-width:360px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:0 10px 40px rgba(20,30,60,.1)}
  .login .lg{text-align:center;font-weight:800;font-size:20px;color:var(--navy)}
  .login .ls{text-align:center;color:var(--sub);font-size:13px;margin:4px 0 20px}
  .login label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:12px 0 5px}
  .login input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  .login .btn{width:100%;margin-top:18px;background:var(--blue);color:#fff;border:none;padding:13px;border-radius:11px;font-weight:800;font-size:15px;cursor:pointer}
  .login .err{color:#c0392b;font-size:12.5px;margin-top:10px;text-align:center;min-height:16px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0}
  .bar select,.bar input[type=date]{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
  .langseg{display:flex;background:#e9eef6;border-radius:10px;padding:3px}
  .langseg button{border:none;background:none;padding:8px 13px;border-radius:8px;font-weight:800;font-size:13px;color:var(--sub);cursor:pointer}
  .langseg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .eyebrow{color:var(--green-d);font-weight:800;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin:20px 2px 10px}
  .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:720px){.tools{grid-template-columns:1fr}}
  .tool{display:flex;gap:13px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;transition:.15s}
  .tool:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(26,39,64,.1);border-color:#c7dcc7}
  .tool .ic{font-size:26px;width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--soft);flex:none}
  .tool h3{font-size:15px;color:var(--navy);font-weight:800}
  .tool p{font-size:12px;color:var(--sub);margin-top:2px}
  .tool .soon{font-size:10px;font-weight:800;color:#8a6d1a;background:#fef6df;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:middle}
  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
  .phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .phead h2{font-size:16px;color:var(--navy);font-weight:800}
  .phead .pill{font-size:11px;font-weight:800;color:var(--blue-d);background:#eaf2fc;border-radius:999px;padding:3px 9px}
  .desc{color:var(--sub);font-size:12.5px;margin-bottom:14px}
  .evalrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .evalrow select{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
  .mini{border:1px dashed #b9c6da;background:#f2f6fc;color:var(--blue-d);font-weight:700;font-size:13px;padding:9px 12px;border-radius:10px;cursor:pointer}
  .hint{font-size:11.5px;color:#8a6d1a;background:#fef6df;border-radius:999px;padding:5px 11px}
  .tblwrap{overflow-x:auto}
  table.grid{width:100%;border-collapse:collapse;min-width:720px}
  table.grid th,table.grid td{padding:11px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:13.5px}
  table.grid thead th{background:var(--soft);color:var(--sub);font-weight:800;font-size:12px}
  table.grid td.name{text-align:left;font-weight:700;color:var(--navy)}
  table.grid td.name small{display:block;color:var(--sub);font-weight:500;font-size:11.5px}
  table.grid select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
  .chk{width:22px;height:22px;cursor:pointer;accent-color:var(--green)}
  .scorebox{display:inline-flex;align-items:center;gap:4px}
  .scorebox input{width:44px;padding:6px;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:14px}
  .iconbtn{background:none;border:none;font-size:16px;cursor:pointer;opacity:.6}.iconbtn:hover{opacity:1}
  .iconbtn.filled{opacity:1}
  .memogrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 14px}
  @media(max-width:720px){.memogrid{grid-template-columns:1fr}}
  .clsmemo{background:#f4f8ff;border:1px solid #d6e2f2;border-left:4px solid var(--blue);border-radius:12px;padding:12px 14px}
  .clsmemo.tealog{background:#faf7ff;border-color:#e3d8f5;border-left-color:#7b3fe4}
  .clsmemo textarea{width:100%;border:1.5px solid #c3d4ea;border-radius:10px;background:#fff;padding:10px 12px;font:inherit;font-size:14px;resize:vertical}
  .clsmemo textarea:focus{outline:none;border-color:var(--blue)}
  .clsmemo textarea.locked{background:#eef2f8;color:#333}
  .memoact{display:flex;align-items:center;gap:8px;margin-top:8px}
  .memostat{font-size:12px;font-weight:700;flex:1;text-align:right}
  .mbtn{border:none;border-radius:9px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer;min-width:92px;text-align:center;white-space:nowrap}
  .mbtn.pri{background:var(--blue);color:#fff}.mbtn.ghost{background:#fff;border:1px solid var(--line);color:var(--sub)}
  .modal{position:fixed;inset:0;background:rgba(20,30,60,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
  .modal.on{display:flex}
  .modal .box{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(20,30,60,.3)}
  .modal .box h3{font-size:16px;color:var(--navy);font-weight:800;margin-bottom:14px}
  .modal .box textarea,.modal .box input[type=text],.modal .box select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;margin-bottom:10px}
  .modal .box label.ck{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub);margin:4px 0 14px;cursor:pointer}
  .modal .box .row{display:flex;gap:10px;justify-content:flex-end}
  .modal .box .b{border:none;border-radius:10px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer}
  .modal .box .b.pri{background:var(--blue);color:#fff}.modal .box .b.ghost{background:var(--soft);color:var(--sub)}
  .saverow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .saverow .note{font-size:12.5px;color:var(--sub)}
  .btnsave{display:flex;gap:8px}
  .btn2{padding:11px 18px;border-radius:11px;font-weight:800;font-size:14px;border:none;cursor:pointer}
  .btn2.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
  .btn2.pri{background:var(--blue);color:#fff}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:80}
  .toast.on{opacity:1}
  .hidden{display:none}
</style>
</head>
<body>

<div id="setupBanner" class="setup hidden"></div>

<div id="loginView" class="hidden">
  <div class="login">
    <div class="lg" data-t="loginTitle"></div>
    <div class="ls" data-t="loginSub"></div>
    <label data-t="idLabel"></label>
    <input id="uid" type="text" autocomplete="username" autocapitalize="none">
    <label data-t="pwLabel"></label>
    <input id="upw" type="password" autocomplete="current-password">
    <button class="btn" id="loginBtn" data-t="login"></button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="dashView" class="hidden">
  <header>
    <div class="wrap hd">
      <div class="ttl"><span data-t="headTitle"></span><small data-t="headSub"></small></div>
      <div style="display:flex;align-items:center">
        <div class="me"><b id="teaName"></b><br><span id="teaClasses"></span></div>
        <button class="out" id="logoutBtn" data-t="logout"></button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="bar">
      <div class="langseg">
        <button data-lang="ko">한국어</button>
        <button data-lang="en">English</button>
      </div>
      <select id="teaSel" title="선생님 (데모)"></select>
      <select id="classSel"></select>
      <input type="date" id="dateSel">
    </div>

    <div class="eyebrow" data-t="tools"></div>
    <div class="tools">
      <a class="tool" href="../write/index.html"><div class="ic">✍️</div><div><h3>Writing Lab</h3><p data-t="toolWriting"></p></div></a>
      <a class="tool" href="#" onclick="toast(T().soonReport);return false"><div class="ic">📄</div><div><h3 data-t="toolReport"></h3><p data-t="toolReportSub"></p></div></a>
      <a class="tool" href="#" onclick="toast(T().soonWorkbook);return false"><div class="ic">📚</div><div><h3 data-t="toolWorkbook"></h3><p data-t="toolWorkbookSub"></p></div></a>
      <a class="tool" id="notionCard" href="#" target="_blank" rel="noopener"><div class="ic">📒</div><div><h3 data-t="toolNotion"></h3><p data-t="toolNotionSub"></p></div></a>
    </div>

    <div class="eyebrow" style="margin-top:24px" data-t="records"></div>
    <div class="panel">
      <div class="phead"><h2 data-t="indEntry"></h2><span class="pill" id="clsPill"></span></div>
      <div class="desc" data-t="indDesc"></div>
      <div class="evalrow">
        <span style="font-size:13px;font-weight:700;color:var(--sub)" data-t="test"></span>
        <select id="evalSel"></select>
        <button class="mini" onclick="toast(T().newTestSoon)" data-t="newTest"></button>
        <span class="hint" data-t="testHint"></span>
      </div>
      <div class="memogrid">
        <div class="clsmemo">
          <label data-t="clsMemo" style="display:block;font-size:13.5px;font-weight:800;color:var(--navy);margin:0 0 3px"></label>
          <div data-t="clsMemoDesc" style="font-size:12px;color:var(--sub);margin:0 0 7px"></div>
          <textarea id="clsMemo" rows="3" oninput="memoStore()"></textarea>
          <div class="memoact">
            <button id="memoEditBtn" class="mbtn ghost" onclick="memoEdit()"></button>
            <button id="memoPubBtn" class="mbtn pri" onclick="memoPublish()"></button>
            <span id="memoStatus" class="memostat"></span>
          </div>
        </div>
        <div class="clsmemo tealog">
          <label data-t="teaLog" style="display:block;font-size:13.5px;font-weight:800;color:var(--navy);margin:0 0 3px"></label>
          <div data-t="teaLogDesc" style="font-size:12px;color:var(--sub);margin:0 0 7px"></div>
          <textarea id="teaLog" rows="3" oninput="teaDirty()"></textarea>
          <div class="memoact">
            <button id="teaEditBtn" class="mbtn ghost" onclick="teaEdit()"></button>
            <button id="teaSaveBtn" class="mbtn pri" onclick="teaSave()"></button>
            <span id="teaStatus" class="memostat" style="color:var(--sub);font-weight:700"></span>
          </div>
        </div>
      </div>
      <div class="tblwrap"><table class="grid">
        <thead><tr>
          <th style="text-align:left" data-t="cStudent"></th><th data-t="cAtt"></th><th data-t="cHw"></th>
          <th data-t="cScore"></th><th data-t="cAttitude"></th><th data-t="cVideo"></th><th data-t="cNote"></th><th data-t="cPub"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>

    <div class="desc" data-t="gridHelp" style="margin-top:12px;font-size:12.5px;line-height:1.7"></div>

    <div class="saverow">
      <div class="note" data-t="saveNote"></div>
      <div class="btnsave">
        <button class="btn2 ghost" onclick="save(false)" data-t="saveDraft"></button>
        <button class="btn2 pri" onclick="save(true)" data-t="savePublish"></button>
      </div>
    </div>
    <div style="height:30px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="cellModal">
  <div class="box">
    <h3 id="mTitle"></h3>
    <div id="mVid">
      <input type="text" id="mVidUrl">
      <label class="ck"><input type="checkbox" id="mVidPub"><span id="mVidLbl"></span></label>
    </div>
    <div id="mNote">
      <select id="mNoteType" onchange="notePolicy()"><option value="general"></option><option value="repeat"></option><option value="sensitive"></option></select>
      <div id="mNoteRule" style="font-size:12px;line-height:1.6;background:#f4f8ff;border:1px solid #d6e2f2;border-radius:9px;padding:8px 11px;margin:0 0 10px;color:var(--sub)"></div>
      <textarea id="mNoteTxt" rows="3"></textarea>
      <label class="ck"><input type="checkbox" id="mNotePub"><span id="mNoteLbl"></span></label>
    </div>
    <div class="row">
      <button class="b ghost" id="mCancel" onclick="document.getElementById('cellModal').classList.remove('on')"></button>
      <button class="b pri" id="mSave" onclick="saveCell()"></button>
    </div>
  </div>
</div>

let LANG = localStorage.getItem('klai_tea_lang') || 'en';   // 기본 영어(원어민)

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }
window.toast = toast;

function applyLang(){
  const s = STR[LANG];
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(el=>{ const v=s[el.dataset.t]; if(typeof v==='string') el.textContent=v; });
  $('#setupBanner').textContent = s.setup;
  $('#uid').placeholder = LANG==='ko'?'예: anna':'e.g. anna';
  $('#upw').placeholder = LANG==='ko'?'비밀번호':'Password';
  $('#evalSel').innerHTML = s.evals.map(e=>`<option>${e}</option>`).join('');
  $('#clsMemo').placeholder = s.clsMemoPh; $('#teaLog').placeholder = s.teaLogPh; memoSync();
  document.querySelectorAll('.langseg button').forEach(b=>b.classList.toggle('on', b.dataset.lang===LANG));
  if($('#teaName').dataset.demo==='1'){ $('#teaName').textContent=TEACHER; $('#teaClasses').textContent=`${Object.keys(DEMO).length}${LANG==='ko'?'개 반':' classes'}`; }
  renderRows($('#classSel').value || Object.keys(DEMO)[0]);
}
function setLang(l){ LANG=l; localStorage.setItem('klai_tea_lang',l); applyLang(); }
document.querySelectorAll('.langseg button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

function fillClasses(){ $('#classSel').innerHTML = Object.keys(DEMO).map(n=>`<option>${n}</option>`).join(''); }
const EVALMAX=[6,25,'']; // evals 순서: 단어시험=6, 월말평가=25, 레벨테스트=빈칸(통과/미달)
function renderRows(cls){
  const s=STR[LANG], list=DEMO[cls]||[];
  const MX = EVALMAX[$('#evalSel').selectedIndex] ?? '';
  $('#clsPill').textContent = `${cls} · ${list.length}${LANG==='ko'?'명':' '+s.students}`;
  $('#rows').innerHTML = list.map(st=>`
    <tr>
      <td class="name">${LANG==='ko'?st.ko:st.en} <span style="color:var(--sub);font-weight:500;font-size:12px">${st.code}</span><small>${LANG==='ko'?st.en:st.ko}</small></td>
      <td><select class="att">${s.att.map(a=>`<option>${a}</option>`).join('')}</select></td>
      <td><input type="checkbox" class="chk hw"></td>
      <td><span class="scorebox"><input class="sc" type="number" min="0" placeholder="-"> / <input class="mx" type="number" min="1" value="${MX}"></span></td>
      <td><select class="tae">${s.tae.map(a=>`<option>${a}</option>`).join('')}</select></td>
      <td><button class="iconbtn vidbtn" onclick="openCell(this,'vid')">🎬＋</button></td>
      <td><button class="iconbtn notebtn" onclick="openCell(this,'note')">📝</button></td>
      <td><input type="checkbox" class="chk pub" checked></td>
    </tr>`).join('');
}
function collect(){ return [...document.querySelectorAll('#rows tr')].map(tr=>({
  att:ATTV[tr.querySelector('.att').value], homework:tr.querySelector('.hw').checked,
  score:tr.querySelector('.sc').value||null, max:tr.querySelector('.mx').value||null,
  attitude:tr.querySelector('.tae').selectedIndex, isPublic:tr.querySelector('.pub').checked })); }
function save(publish){

// ── 메모(날짜별 저장): 왼쪽=반전체 발행 / 오른쪽=강사 일지 ──────
// ponytail: localStorage 저장(데모). Phase2에서 Supabase로 교체.
let memoEver=false, memoLocked=false, teaLocked=false;
function memoKey(){ return `klai_memo::${TEACHER}::${$('#classSel').value}::${$('#dateSel').value}`; }
function memoStore(){
  localStorage.setItem(memoKey(), JSON.stringify({
    cls:$('#clsMemo').value, clsLocked:memoLocked, clsEver:memoEver, tea:$('#teaLog').value, teaLocked }));
}
function memoLoad(){
  let d={}; try{ d=JSON.parse(localStorage.getItem(memoKey())||'{}'); }catch(e){}
  $('#clsMemo').value=d.cls||''; memoLocked=!!d.clsLocked; memoEver=!!d.clsEver;
  $('#teaLog').value=d.tea||''; teaLocked = d.teaLocked ?? !!d.tea; memoSync();
}
function memoSync(){
  const ko=LANG==='ko', ta=$('#clsMemo');
  ta.readOnly=memoLocked; ta.classList.toggle('locked',memoLocked);
  $('#memoPubBtn').textContent = memoEver ? (ko?'🔄 재발행':'🔄 Re-publish') : (ko?'발행하기':'Publish');
  $('#memoEditBtn').textContent = ko?'✏️ 수정':'✏️ Edit';
  const st=$('#memoStatus');
  st.textContent = memoLocked ? (ko?'✅ 학생·학부모에게 발행됨':'✅ Published to students & parents')
    : memoEver ? (ko?'✏️ 수정 중 — 재발행하면 반영돼요':'✏️ Editing — re-publish to apply')
    : '';
  st.style.color = memoLocked?'var(--green-d)':'var(--sub)';
  // 오른쪽 일지 (수정→저장 잠금→수정)
  const t2=$('#teaLog'); t2.readOnly=teaLocked; t2.classList.toggle('locked',teaLocked);
  $('#teaSaveBtn').textContent = ko?'💾 저장':'💾 Save';
  $('#teaEditBtn').textContent = ko?'✏️ 수정':'✏️ Edit';
  const ts=$('#teaStatus');
  ts.textContent = teaLocked ? (ko?'🔒 나만 봄 · 저장됨':'🔒 Private · saved') : '';
  ts.style.color = teaLocked?'var(--sub)':'#c0392b';
}
function memoPublish(){
  if(!$('#clsMemo').value.trim()){ toast(LANG==='ko'?'내용을 입력하세요':'Enter a note'); return; }
  const re=memoEver; memoEver=true; memoLocked=true; memoStore(); memoSync();
  toast(LANG==='ko'?(re?'반 전체 메모 재발행됨':'반 전체 메모 발행됨'):(re?'Re-published':'Published'));
}
function memoEdit(){ memoLocked=false; memoStore(); memoSync(); }
function teaDirty(){ memoStore(); }   // 초안 자동 보관(잠금 전), 상태는 '수정 중'
function teaSave(){ teaLocked=true; memoStore(); memoSync(); toast(LANG==='ko'?'강사 일지 저장됨':'Log saved'); }
function teaEdit(){ teaLocked=false; memoStore(); memoSync(); }
window.memoPublish=memoPublish; window.memoEdit=memoEdit; window.memoStore=memoStore;
window.teaDirty=teaDirty; window.teaSave=teaSave; window.teaEdit=teaEdit;

// ── 영상/개별메모 셀 (데모: 행에 임시 저장) ──────────────
let CELL=null;
function openCell(btn,kind){
  CELL={btn,kind,tr:btn.closest('tr')};
  const ko=LANG==='ko', name=CELL.tr.querySelector('.name').firstChild.textContent.trim();
  $('#mTitle').textContent = (kind==='vid'?'🎬 ':'📝 ')+name;
  $('#mVid').classList.toggle('hidden', kind!=='vid');
  $('#mNote').classList.toggle('hidden', kind!=='note');
  if(kind==='vid'){ $('#mVidUrl').value=CELL.tr.dataset.vid||''; $('#mVidPub').checked=CELL.tr.dataset.vidpub!=='0';
    $('#mVidUrl').placeholder=ko?'수업 영상 링크 (유튜브·드라이브 등)':'Class video link (YouTube, Drive…)';
    $('#mVidLbl').textContent=ko?'학생·학부모에게 공개':'Show to student & parent'; }
  else { $('#mNoteTxt').value=CELL.tr.dataset.note||''; $('#mNoteType').value=CELL.tr.dataset.notetype||'general'; $('#mNotePub').checked=CELL.tr.dataset.notepub==='1';
    $('#mNoteTxt').placeholder=ko?'객관적 사실만 (예: 숙제 미제출 3회, 수업 중 이석 반복)':'Objective facts only (e.g. HW missed 3×, repeated out-of-seat)';
    notePolicy(); }
  [...$('#mNoteType').options].forEach((o,i)=>o.textContent=(LANG==='ko'
    ?['일반 메모 (내부 기록)','⚠️ 반복 지도 3회+ (학부모 공개·월말 반영)','🔒 민감 사항 (학부모 공개 금지)']
    :['General (internal)','⚠️ Repeated 3×+ (shared · affects monthly)','🔒 Sensitive (never shared)'])[i]);
  $('#mSave').textContent=ko?'저장':'Save'; $('#mCancel').textContent=ko?'취소':'Cancel';
  $('#cellModal').classList.add('on');
}
function notePolicy(){
  const ko=LANG==='ko', t=$('#mNoteType').value, cb=$('#mNotePub'), lbl=$('#mNoteLbl'), rule=$('#mNoteRule');
  if(t==='sensitive'){ cb.checked=false; cb.disabled=true;
    lbl.textContent=ko?'민감 사항은 학부모 공개 불가 (내부 보관만)':'Sensitive — cannot be shared (internal only)';
    rule.textContent=ko?'🔒 가정사·심리·건강 등 예민한 내용. 원장·선생님만 열람. 학부모 공개·월말 반영 안 함.':'🔒 Family, emotional or health matters. Staff only. Never shared, never in monthly.'; }
  else if(t==='repeat'){ cb.disabled=false;
    lbl.textContent=ko?'학부모에게 공개 (권장 · 월말평가 반영)':'Share with parent (recommended · affects monthly)';
    rule.textContent=ko?'⚠️ 3회 이상 지도에도 고쳐지지 않은 부분만 여기에. 공개 시 월말평가 학습태도에 반영돼요.':'⚠️ Only issues unchanged after 3+ reminders. When shared, it feeds the monthly attitude score.'; }
  else { cb.disabled=false;
    lbl.textContent=ko?'학부모에게 공개 (기본: 선생님·원장만)':'Share with parent (default: staff only)';
    rule.textContent=ko?'일상 기록. 기본 비공개. 지도 횟수 쌓는 용도 — 3회+ 되면 "반복 지도"로 올려 공개.':'Everyday log. Private by default. Track reminders — escalate to "Repeated" once it hits 3+.'; }
}
window.notePolicy=notePolicy;

function saveCell(){
  const tr=CELL.tr;
  if(CELL.kind==='vid'){ tr.dataset.vid=$('#mVidUrl').value.trim(); tr.dataset.vidpub=$('#mVidPub').checked?'1':'0';
    CELL.btn.textContent = tr.dataset.vid ? '🎬✓' : '🎬＋'; CELL.btn.classList.toggle('filled',!!tr.dataset.vid); }
  else { tr.dataset.note=$('#mNoteTxt').value.trim(); tr.dataset.notetype=$('#mNoteType').value; tr.dataset.notepub=$('#mNotePub').checked?'1':'0';
    CELL.btn.textContent = tr.dataset.note ? ({general:'📝•',repeat:'⚠️•',sensitive:'🔒•'}[tr.dataset.notetype]||'📝•') : '📝'; CELL.btn.classList.toggle('filled',!!tr.dataset.note); }
  $('#cellModal').classList.remove('on'); CELL=null;
}
window.openCell=openCell;

function show(v){ ['loginView','dashView'].forEach(x=>$('#'+x).classList.toggle('hidden', x!==v)); }

if(!SUPABASE_URL || !SUPABASE_ANON){
  $('#setupBanner').classList.remove('hidden');
  $('#teaName').dataset.demo='1'; boot(); show('dashView');
} else { (async()=>{
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
  async function route(){ const { data:{ session } } = await sb.auth.getSession();
    if(session){ $('#teaName').textContent = session.user.user_metadata?.name || session.user.email?.split('@')[0] || 'Teacher';
      $('#teaClasses').textContent=''; boot(); show('dashView'); } else { applyLang(); show('loginView'); } }
  $('#loginBtn').onclick = async ()=>{ const id=$('#uid').value.trim(),pw=$('#upw').value; $('#loginErr').textContent='';
    if(!id||!pw){ $('#loginErr').textContent=STR[LANG].needInput; return; }
    const email=id.includes('@')?id:id+ID_DOMAIN; const {error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error) $('#loginErr').textContent=STR[LANG].badLogin; else route(); };
  $('#upw').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#loginBtn').click(); });
  $('#logoutBtn').onclick = async ()=>{ await sb.auth.signOut(); route(); };
  applyLang(); route();
})(); }
</script>
