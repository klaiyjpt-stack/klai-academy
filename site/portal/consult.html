<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신규 상담기록 · 클라이 어학원</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--blue:#2b74c4;--blue-d:#215a99;--green:#7cc242;--green-d:#5ea52c;--navy:#1a2740;--ink:#233;--sub:#5b6577;--line:#e6e9f0;--soft:#f4f7fc;--red:#c0392b;
    --font:Pretendard,"Apple SD Gothic Neo",-apple-system,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--soft);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  header{background:linear-gradient(120deg,#1a2740,#2b74c4);color:#fff;position:sticky;top:0;z-index:20}
  .hd{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
  .hd .ttl{font-weight:800;font-size:17px}.hd .ttl small{display:block;font-weight:500;font-size:11.5px;opacity:.9;margin-top:2px}
  .hd .btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer}
  .wrap{max-width:1080px;margin:0 auto;padding:16px}
  .grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .card h2{font-size:15px;color:var(--navy);margin-bottom:12px}
  label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:var(--font);background:#fff}
  textarea{resize:vertical;min-height:120px;line-height:1.6}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  @media(max-width:520px){.row,.row3{grid-template-columns:1fr}}
  .btnp{background:var(--blue);color:#fff;border:none;font-weight:800;padding:12px 18px;border-radius:11px;cursor:pointer;font-size:14px}
  .btnp:hover{background:var(--blue-d)}
  .btnai{background:var(--navy);color:#fff;border:none;font-weight:800;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:13.5px}
  .btnai:disabled{opacity:.5}
  .btng{background:none;border:1px solid var(--line);color:var(--sub);font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer;font-size:13px}
  .chk{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13.5px}
  .chk input{width:auto;margin-top:3px}
  .listitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
  .listitem:hover{border-color:var(--blue);background:#f9fbff}
  .listitem .nm{font-weight:800;font-size:14px;color:var(--navy)}
  .listitem .meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
  .b-등록{background:#e8f6e0;color:var(--green-d)} .b-보류{background:#fff3cd;color:#8a6d00} .b-미등록{background:#fdeaea;color:var(--red)} .b-상담{background:#eef4fb;color:var(--blue-d)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
  .toast.on{opacity:1}
  .login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:0 10px 40px rgba(20,30,60,.1)}
  .login .lg{text-align:center;font-weight:800;font-size:20px;color:var(--navy)}
  .login .go{width:100%;margin-top:18px;background:var(--navy);color:#fff;border:none;padding:13px;border-radius:11px;font-weight:800;font-size:15px;cursor:pointer}
  .login .err{color:var(--red);font-size:12.5px;margin-top:10px;text-align:center;min-height:16px}
  .hidden{display:none}
  .ai-out{background:#f7faff;border:1px dashed #bcd3ef;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;color:#33393f;margin-top:6px}
</style>
</head>
<body>

<div id="loginView" class="hidden">
  <div class="login">
    <div class="lg">📝 신규 상담기록</div>
    <label>이메일</label>
    <input id="uid" type="text" autocomplete="username" placeholder="klai0000@exam.email" autocapitalize="none">
    <label>비밀번호</label>
    <input id="upw" type="password" autocomplete="current-password">
    <button class="go" id="loginBtn">로그인</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="mainView" class="hidden">
  <header><div class="hd">
    <div class="ttl">📝 신규 상담기록<small>클라이 어학원 · 데스크·원장</small></div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="newBtn">+ 새 상담</button>
      <a class="btn" href="admin.html">원장 관리 →</a>
      <button class="btn" id="logoutBtn">로그아웃</button>
    </div>
  </div></header>

  <div class="wrap"><div class="grid2">
    <!-- 입력 -->
    <div>
      <div class="card" style="border-left:4px solid var(--blue)">
        <h2>📋 확정된 상담 <span id="reqCnt" style="font-size:12px;color:var(--sub);font-weight:600"></span></h2>
        <div style="font-size:11.5px;color:var(--sub);margin-bottom:8px">대시보드에서 확정한 상담만 — 누르면 이름·연락처·상담일이 자동 입력돼요.</div>
        <div id="reqList" style="max-height:200px;overflow:auto">불러오는 중…</div>
      </div>
      <div class="card">
        <h2>학생·학부모</h2>
        <div class="row3">
          <div><label>학생명 *</label><input id="f_student"></div>
          <div><label>학년</label><input id="f_grade" placeholder="예: 중2"></div>
          <div><label>상담일</label><input id="f_date" type="date"></div>
        </div>
        <div class="row3">
          <div><label>학부모명</label><input id="f_parent"></div>
          <div><label>연락처</label><input id="f_phone" placeholder="010-"></div>
          <div><label>상담자</label><input id="f_counselor" placeholder="데스크/원장"></div>
        </div>
        <div class="row">
          <div><label>이전 학원</label><input id="f_prev"></div>
          <div><label>학습이력/현재수준</label><input id="f_hist"></div>
        </div>
        <label>학부모 니즈·목표</label><input id="f_needs" placeholder="예: 내신 대비, 스피킹 강화, 유학 준비">
      </div>

      <div class="card">
        <h2>상담 내용</h2>
        <textarea id="f_note" placeholder="학부모와 나눈 대화·요청·특이사항을 그대로 적어주세요. (녹취/메모 붙여넣기 OK)"></textarea>
        <div style="font-size:12px;color:var(--sub);margin-top:6px">💡 1시간 상담은 <b>클로바노트</b>(무료 앱)로 녹음·전사 → 그 글을 여기 붙여넣고 <b>AI로 정리</b>를 누르세요.</div>
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
          <button class="btnai" id="aiBtn">✨ AI로 정리</button>
          <span id="aiState" style="font-size:12px;color:var(--sub)"></span>
        </div>
      </div>
    </div>

    <!-- 정리·저장 -->
    <div>
      <div class="card">
        <h2>정리 결과</h2>
        <label>핵심 요약</label><textarea id="f_summary" style="min-height:90px"></textarea>
        <div class="row">
          <div><label>추천 반/과목</label><input id="f_reco"></div>
          <div><label>레벨테스트</label><input id="f_level"></div>
        </div>
        <label>수업준비 체크리스트</label>
        <div id="checkBox" style="border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:44px"></div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <input id="newChk" placeholder="항목 추가" style="flex:1">
          <button class="btng" id="addChk">추가</button>
        </div>
        <div class="row" style="margin-top:10px">
          <div><label>다음 액션</label><input id="f_next"></div>
          <div><label>등록여부</label>
            <select id="f_status"><option>상담</option><option>등록</option><option>보류</option><option>미등록</option></select>
          </div>
        </div>
        <button class="btnp" id="saveBtn" style="width:100%;margin-top:14px">💾 저장</button>
      </div>

      <div class="card">
        <h2>최근 상담 <span id="cnt" style="font-size:12px;color:var(--sub);font-weight:600"></span></h2>
        <input id="search" placeholder="이름 검색" style="margin-bottom:10px">
        <div id="list"></div>
      </div>
    </div>
  </div></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const SUPABASE_URL="https://hxlzccwqxamtsjrrtcdq.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4bHpjY3dxeGFtdHNqcnJ0Y2RxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODA2NzgsImV4cCI6MjEwMTg1NjY3OH0.V19Jbcb7fS1lW6SwsZrn-dCTkUPaNN1KmBbdslDxfr4";
const ADMINS=["klai.yj.pt@gmail.com","klai.yj.pt.1@gmail.com"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const kstToday=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
const SB=createClient(SUPABASE_URL,SUPABASE_ANON);
const show=v=>{ $('#loginView').classList.toggle('hidden',v!=='login'); $('#mainView').classList.toggle('hidden',v!=='main'); };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }

let EDIT_ID=null;   // 수정 중인 상담 id
let CHECK=[];       // [{t, done}]

function renderCheck(){
  $('#checkBox').innerHTML = CHECK.length ? CHECK.map((c,i)=>
    `<div class="chk"><input type="checkbox" ${c.done?'checked':''} onchange="window.chkTog(${i})"><span style="flex:1">${esc(c.t)}</span><span onclick="window.chkDel(${i})" style="cursor:pointer;color:var(--sub)">✕</span></div>`
  ).join('') : '<div style="font-size:12.5px;color:var(--sub)">AI 정리하거나 직접 추가</div>';
}
window.chkTog=i=>{ CHECK[i].done=!CHECK[i].done; renderCheck(); };
window.chkDel=i=>{ CHECK.splice(i,1); renderCheck(); };
$('#addChk').onclick=()=>{ const v=$('#newChk').value.trim(); if(!v)return; CHECK.push({t:v,done:false}); $('#newChk').value=''; renderCheck(); };

function clearForm(){
  EDIT_ID=null; CHECK=[];
  ['f_student','f_grade','f_parent','f_phone','f_counselor','f_prev','f_hist','f_needs','f_note','f_summary','f_reco','f_level','f_next'].forEach(id=>$('#'+id).value='');
  $('#f_date').value=kstToday(); $('#f_status').value='상담'; renderCheck(); $('#aiState').textContent='';
}
$('#newBtn').onclick=clearForm;

async function api(path, body){
  const { data:{ session } } = await SB.auth.getSession();
  const r=await fetch(path,{ method:'POST', headers:{ Authorization:'Bearer '+(session?session.access_token:''), 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  return r.json();
}

$('#aiBtn').onclick=async()=>{
  const note=$('#f_note').value.trim();
  if(!note){ toast('상담내용을 먼저 적어주세요'); return; }
  $('#aiBtn').disabled=true; $('#aiState').textContent='정리 중…';
  const j=await api('/api/consult-ai',{
    student_name:$('#f_student').value, grade:$('#f_grade').value, prev_academy:$('#f_prev').value,
    level_history:$('#f_hist').value, needs:$('#f_needs').value, level_test:$('#f_level').value, consult_note:note
  });
  $('#aiBtn').disabled=false; $('#aiState').textContent='';
  if(!j.ok){ toast('AI 실패: '+(j.error||'')); return; }
  if(j.summary) $('#f_summary').value=j.summary;
  if(j.recommend_class) $('#f_reco').value=j.recommend_class;
  if(j.level_test) $('#f_level').value=j.level_test;
  if(j.next_action) $('#f_next').value=j.next_action;
  if(Array.isArray(j.checklist)) { CHECK=j.checklist.map(t=>({t:String(t),done:false})); renderCheck(); }
  toast('AI 정리 완료 — 확인 후 저장');
};

$('#saveBtn').onclick=async()=>{
  const student=$('#f_student').value.trim();
  if(!student){ toast('학생명은 필수'); return; }
  const row={
    student_name:student, grade:$('#f_grade').value||null, parent_name:$('#f_parent').value||null,
    phone:$('#f_phone').value||null, consult_date:$('#f_date').value||kstToday(), counselor:$('#f_counselor').value||null,
    prev_academy:$('#f_prev').value||null, level_history:$('#f_hist').value||null, needs:$('#f_needs').value||null,
    consult_note:$('#f_note').value||null, level_test:$('#f_level').value||null, recommend_class:$('#f_reco').value||null,
    checklist:CHECK, ai_summary:$('#f_summary').value||null, status:$('#f_status').value, next_action:$('#f_next').value||null,
    updated_at:new Date().toISOString()
  };
  let err;
  if(EDIT_ID){ ({error:err}=await SB.from('consultations').update(row).eq('id',EDIT_ID)); }
  else { const { data:{ user } }=await SB.auth.getUser(); row.created_by=user?.id||null; ({error:err}=await SB.from('consultations').insert(row)); }
  if(err){ toast('저장 실패: '+err.message); return; }
  toast(EDIT_ID?'수정됨':'저장됨'); clearForm(); loadList();
};

// 상담신청 접수(홈페이지 → /api/consult, 구글시트) 목록 → 클릭 시 폼 자동채움
let REQS=[];
async function loadReqs(){
  try{
    const { data:{ session } }=await SB.auth.getSession();
    const r=await fetch('/api/consult',{ headers:{ Authorization:'Bearer '+(session?session.access_token:'') } });
    const j=await r.json();
    const rows=(j&&j.rows||[]).filter(x=>x.name||x.phone);
    // 확정된 상담만(과거 전체 X) — 최근 20건, 최신순
    REQS=rows.filter(x=>x.status==='확정').slice(-20).reverse();
    $('#reqCnt').textContent='(확정 '+REQS.length+')';
    $('#reqList').innerHTML = REQS.length ? REQS.map((x,i)=>
      `<div class="listitem" onclick="window.pickReq(${i})"><div class="nm">${esc(x.name||'-')}</div>`+
      `<div class="meta">${esc(x.phone||'')} ${x.date?'· 상담 '+esc(x.date):(x.want?'· 희망 '+esc(x.want):'')}</div></div>`
    ).join('') : '<div style="font-size:12.5px;color:var(--sub)">확정된 상담 없음</div>';
  }catch(e){ $('#reqList').innerHTML='<div style="font-size:12px;color:var(--sub)">신청 목록을 못 불러왔어요</div>'; }
}
window.pickReq=i=>{
  const x=REQS[i]; if(!x) return;
  if(!$('#f_student').value) $('#f_student').value=x.name||'';
  if(!$('#f_parent').value) $('#f_parent').value=x.name||'';
  if(!$('#f_phone').value) $('#f_phone').value=x.phone||'';
  const head=`[홈페이지 상담신청]\n신청자: ${x.name||''} / 연락처: ${x.phone||''}${x.want?' / 희망시간: '+x.want:''}${x.ts?' / 신청일: '+String(x.ts).slice(0,16):''}\n\n`;
  if(!$('#f_note').value.startsWith('[홈페이지 상담신청]')) $('#f_note').value = head + $('#f_note').value;
  window.scrollTo(0,0); toast('상담신청 불러옴 — 학생명 확인 후 상담내용 채우기');
};

async function loadList(){
  const q=$('#search')?.value.trim();
  let query=SB.from('consultations').select('id,student_name,grade,consult_date,status,recommend_class').order('consult_date',{ascending:false}).limit(50);
  if(q) query=query.ilike('student_name','%'+q+'%');
  const { data }=await query;
  const rows=data||[];
  $('#cnt').textContent='('+rows.length+')';
  $('#list').innerHTML = rows.length ? rows.map(r=>
    `<div class="listitem" onclick="window.openRec('${r.id}')"><div class="nm">${esc(r.student_name)} <span class="badge b-${esc(r.status||'상담')}">${esc(r.status||'상담')}</span></div>`+
    `<div class="meta">${esc(r.consult_date||'')} · ${esc(r.grade||'')} ${r.recommend_class?'· '+esc(r.recommend_class):''}</div></div>`
  ).join('') : '<div style="font-size:12.5px;color:var(--sub)">기록 없음</div>';
}
window.openRec=async id=>{
  const { data }=await SB.from('consultations').select('*').eq('id',id).single();
  if(!data) return;
  EDIT_ID=id;
  $('#f_student').value=data.student_name||''; $('#f_grade').value=data.grade||''; $('#f_date').value=data.consult_date||kstToday();
  $('#f_parent').value=data.parent_name||''; $('#f_phone').value=data.phone||''; $('#f_counselor').value=data.counselor||'';
  $('#f_prev').value=data.prev_academy||''; $('#f_hist').value=data.level_history||''; $('#f_needs').value=data.needs||'';
  $('#f_note').value=data.consult_note||''; $('#f_summary').value=data.ai_summary||''; $('#f_reco').value=data.recommend_class||'';
  $('#f_level').value=data.level_test||''; $('#f_next').value=data.next_action||''; $('#f_status').value=data.status||'상담';
  CHECK=Array.isArray(data.checklist)?data.checklist.map(c=>typeof c==='string'?{t:c,done:false}:c):[]; renderCheck();
  window.scrollTo(0,0); toast('불러옴 — 수정 후 저장');
};
$('#search').oninput=loadList;

async function route(){
  const { data:{ session } }=await SB.auth.getSession();
  if(session && ADMINS.includes((session.user.email||'').toLowerCase())){ show('main'); clearForm(); loadList(); loadReqs(); }
  else show('login');
}
$('#loginBtn').onclick=async()=>{
  const id=$('#uid').value.trim(), pw=$('#upw').value; $('#loginErr').textContent='';
  if(!id||!pw){ $('#loginErr').textContent='이메일·비밀번호 입력'; return; }
  const { error }=await SB.auth.signInWithPassword({ email:id, password:pw });
  if(error){ $('#loginErr').textContent='로그인 실패'; return; }
  const { data:{ session } }=await SB.auth.getSession();
  if(!session || !ADMINS.includes((session.user.email||'').toLowerCase())){ await SB.auth.signOut(); $('#loginErr').textContent='원장/데스크 전용입니다'; return; }
  route();
};
$('#upw').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#loginBtn').click(); });
$('#logoutBtn').onclick=async()=>{ await SB.auth.signOut(); route(); };
route();
</script>
</body>
</html>
