<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>사이트워드 워드리스트</title>
<style>
@page{size:A4 portrait;margin:14mm}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#111;font-size:13px}
h1{font-size:17px;margin:0 0 4px} h2{font-size:14px;border-bottom:2px solid #333;padding-bottom:3px;margin:16px 0 8px}
.hd{display:flex;gap:20px;font-size:13px;margin:6px 0 4px}
table{border-collapse:collapse;width:100%} td,th{border:1px solid #444;padding:5px 7px;font-size:12.5px}
thead th{background:#eef2ff}
.write td{height:26px} .write td:first-child{width:110px;font-weight:700}
.match td{vertical-align:top;line-height:2.1}
.match td:first-child{text-align:right;padding-right:34px;width:46%}
.match td:last-child{text-align:left;padding-left:34px} .match .dot{font-size:15px}
.blank{border-bottom:1px solid #333;display:inline-block;min-width:56px;height:1em}
.cloze{line-height:2.6;font-size:14px}
.controls{margin:10px 0;padding:10px;background:#f4f7fc;border-radius:8px}
.controls select,.controls button{font-size:14px;padding:6px 10px;margin-right:6px}
.controls button{background:#3b5bdb;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer}
@media screen{body{max-width:760px;margin:20px auto;padding:0 12px}}
.back{display:inline-block;background:#eef2ff;color:#3b5bdb;text-decoration:none;font-weight:800;padding:6px 14px;border-radius:8px;margin-right:14px}
.controls input{font-size:14px;padding:5px 9px;border:1px solid #bbb;border-radius:6px;width:170px}
.lvblock{margin-bottom:14px}
/* cover */
.cover{page-break-after:always;height:255mm;border-radius:24px;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(155deg,#4a6cf7,#8a5cf6);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.c-badge{font-size:14px;letter-spacing:.24em;text-transform:uppercase;opacity:.9}
.c-acad{font-size:30px;font-weight:900;margin:8px 0 30px}
.c-title{font-size:76px;font-weight:900;line-height:1;letter-spacing:-2px}
.c-sub{font-size:17px;opacity:.92;margin:16px 0 26px}
.c-deco{font-size:40px;letter-spacing:10px;margin:14px 0 40px}
.c-name{font-size:18px;margin:14px 0;display:flex;gap:14px;align-items:flex-end;justify-content:center}
.c-uline{display:inline-block;width:250px;border-bottom:2px solid rgba(255,255,255,.85);height:1.3em}
@media print{.controls{display:none}}
</style></head><body>
<div class="controls">
  <a href="../index.html" class="back">← 앱으로</a>
  <label>학원명: <input id="acadName" placeholder="클라이 어학원"></label>
  <div style="margin-top:8px">
    레벨: <select id="lvSel"></select>
    세트: <select id="setSel"></select>
    <button onclick="render()">선택 생성</button>
    <button onclick="renderFull()">📚 전체 워드리스트 (겉표지 포함)</button>
    <button onclick="print()">🖨 인쇄</button>
  </div>
</div>
<div id="sheet"></div>
<script src="../data/words.js"></script>
<script>
const SET_SIZE=7;
const sel=document.getElementById("lvSel");
const setSel=document.getElementById("setSel");
for(let l=1;l<=16;l++){const o=document.createElement("option");o.value=l;o.textContent="L"+l+(l>=12?" (명사)":"");sel.appendChild(o);}
function levelWords(lvl){ return window.WORDS.filter(w=>w.level===lvl); }
function nSets(lvl){ return Math.ceil(levelWords(lvl).length / SET_SIZE); }
function fillSets(){
  const lvl=+sel.value; setSel.innerHTML="";
  const all=document.createElement("option"); all.value="all"; all.textContent="레벨 전체"; setSel.appendChild(all);
  for(let s=0;s<nSets(lvl);s++){ const o=document.createElement("option"); o.value=s; o.textContent="세트 "+(s+1); setSel.appendChild(o); }
}
sel.onchange=fillSets; fillSets();
const acadInput=document.getElementById("acadName");
const ACAD_KEY="klai_acad_name";
acadInput.value=localStorage.getItem(ACAD_KEY)||"클라이 어학원";
acadInput.oninput=()=>localStorage.setItem(ACAD_KEY, acadInput.value);
function acad(){ return acadInput.value.trim()||"클라이 어학원"; }
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function wordRow(w){ return `<tr><td style="font-weight:700;font-size:15px">${w.emoji?w.emoji+" ":""}${esc(w.en)}</td><td>${esc(w.ko)}</td><td>${w.pos}</td><td>${esc(w.example)}</td></tr>`; }
function render(){
  const lvl=+sel.value, setV=setSel.value;
  const levelAll=levelWords(lvl);
  const words = setV==="all" ? levelAll : levelAll.slice(+setV*SET_SIZE, +setV*SET_SIZE+SET_SIZE);
  const setLabel = setV==="all" ? "" : ` · 세트 ${+setV+1}`;
  let h=`<div style="font-size:13px;color:#5b3bdb;font-weight:800">${esc(acad())}</div>`;
  h+=`<h1>사이트워드 워드리스트 · L${lvl}${lvl>=12?" (명사)":""}${setLabel}</h1>`;
  h+=`<div class="hd"><span>이름: __________</span><span>날짜: __________</span></div>`;
  h+=`<table><thead><tr><th>영어</th><th>뜻</th><th>품사</th><th>예문</th></tr></thead><tbody>`;
  words.forEach(w=>h+=wordRow(w));
  h+=`</tbody></table>`;
  document.getElementById("sheet").innerHTML=h;
}
function renderFull(){
  let h=`<div class="cover"><div>
    <div class="c-badge">Sight Words · Dolch 315</div>
    <div class="c-acad">${esc(acad())}</div>
    <div class="c-title">WORD&nbsp;LIST</div>
    <div class="c-sub">사이트워드 워드리스트 · 315단어 · 16레벨</div>
    <div class="c-deco">🐣 🦊 🐼 🦄 🐬 🌟 🏆</div>
    <div class="c-name">학생 이름 <span class="c-uline"></span></div>
    <div class="c-name">시작한 날 <span class="c-uline"></span></div>
  </div></div>`;
  for(let l=1;l<=16;l++){
    const ws=levelWords(l);
    h+=`<div class="lvblock"><h2>Level ${l}${l>=12?" · 명사":""} <span style="font-weight:400;font-size:12px;color:#666">(${ws.length}단어)</span></h2>`;
    h+=`<table><thead><tr><th>영어</th><th>뜻</th><th>품사</th><th>예문</th></tr></thead><tbody>`;
    ws.forEach(w=>h+=wordRow(w));
    h+=`</tbody></table></div>`;
  }
  document.getElementById("sheet").innerHTML=h;
}
render();
</script></body></html>
